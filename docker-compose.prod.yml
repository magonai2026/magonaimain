services:

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Bound to loopback so only the host's nginx can reach it. Publishing on
      # 0.0.0.0 put the gateway straight on the public internet, letting anyone
      # bypass nginx — and with it the rate limiting and TLS termination.
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    restart: always
    # Optional: health check so the orchestrator knows when the container is ready
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
